tools:
  - name: execute_services
    description: "Exécute un ou plusieurs services Home Assistant. Utilise cette fonction UNIQUEMENT si aucune autre fonction ne correspond à la demande."
    parameters:
      type: object
      properties:
        list:
          type: array
          items:
            type: object
            properties:
              domain:
                type: string
                description: "Domaine du service (ex: 'light', 'cover')"
              service:
                type: string
                description: "Service à appeler (ex: 'turn_on', 'close_cover')"
              service_data:
                type: object
                description: "Données du service (ex: entity_id, position, etc.)"
                properties:
                  entity_id:
                    type: array
                    items:
                      type: string
                    description: "Liste des entités cibles"
            required:
              - domain
              - service
              - service_data
    function:
      type: native
      name: execute_service

  - name: add_event
    description: "Ajoute un événement ou rendez-vous ou rappel à mon agenda. Si plusieurs jours sont concernés, ne faire qu'un seul appel qui englobe tous les jours."
    parameters:
      type: object
      properties:
        title:
          type: string
          description: "Le titre de l'événement"
        start_time:
          type: string
          description: "L'heure de début de l'événement au format ISO 8601 (ex: 2026-08-06T14:00:00)"
        end_time:
          type: string
          description: "L'heure de fin de l'événement au format ISO 8601. Si omis, ajouter 30 minutes à start_time."
      required:
        - title
        - start_time
    function:
      type: script
      sequence:
        - service: calendar.create_event
          data:
            summary: "{{ title }}"
            start_date_time: "{{ start_time }}"
            end_date_time: >-
              {% if end_time %}
                {{ end_time }}
              {% else %}
                {{ (as_datetime(start_time) + timedelta(minutes=30)).isoformat() }}
              {% endif %}
          target:
            entity_id: calendar.xxx_yyy_gmail_com

  - name: assist_timer
    description: "Démarre un rappel ou timer pour le four, la plaque, ou un usage générique. Si une date de fin est donnée, calcule la durée en heures/minutes/secondes par rapport à maintenant."
    parameters:
      type: object
      properties:
        heures:
          type: integer
          description: "Durée du timer en heures (0 si non précisé)"
        minutes:
          type: integer
          description: "Durée du timer en minutes (0 si non précisé)"
        secondes:
          type: integer
          description: "Durée du timer en secondes (0 si non précisé)"
        texte:
          type: string
          description: "Sujet du rappel (ex: 'four', 'plaque')"
        satellite_id:
          type: string
          description: "L'identifiant exact du satellite courant. Ne jamais l'inventer."
        salle_cible:
          type: string
          description: "Salle où annoncer le timer (ex: 'Salon'). Laisser vide si non précisé."
          enum:
            - Salon
            - Salle à manger
            - Chambre Christophe
      required:
        - heures
        - minutes
        - secondes
        - texte
        - satellite_id
    function:
      type: script
      sequence:
        - action: script.assist_timer
          data:
            heures: "{{ heures }}"
            minutes: "{{ minutes }}"
            secondes: "{{ secondes }}"
            texte: "{{ texte }}"
            satellite_id: >-
              {% set target = salle_cible | default('') %}
              {% set candidats = area_entities(target) | select('match', 'assist_satellite\\.') | list %}
              {{ candidats[0] if candidats else satellite_id }}

  - name: add_one_note
    description: "Ajoute une note ou une tâche dans todo.assist au sujet d'une chose importante dont je dois me rappeler"
    parameters:
      type: object
      properties:
        item:
          type: string
          description: "La note ou tâche à ajouter à todo.assist"
      required:
      - item
    function:
      type: script
      sequence:
      - service: todo.add_item
        data:
          item: '{{item}}'
        target:
          entity_id: todo.assist

  - name: list_all_notes
    description: "Permet de me donner la liste des notes ou tâches mémorisées dans todo.assist"
    parameters:
      type: object
      properties:
        memory:
          type: string
          description: "entity_id de la liste des choses dont je dois me rappeler"
          enum:
            - todo.assist
      required:
      - memory
    function:
      type: script
      sequence:
      - service: todo.get_items
        target:
          entity_id: '{{memory}}'
        data:
          status: needs_action
        response_variable: _function_result

  - name: get_weather
    description: "Permet d'obtenir la météo prévue sur une ville que je te donne."
    parameters:
      type: object
      properties:
        city_id:
          type: string
          description: "Ville pour laquelle je veux la météo."
      required:
        - city_id
    function:
      type: rest
      resource_template: "https://api.tomorrow.io/v4/weather/forecast?location={{city_id}}&timesteps=1d&apikey=REMPLACER_PAR_VOTRE_CLE"
      value_template: '{{value_json}}'

  - name: get_attributes
    description: "Get attributes of any home assistant entity"
    parameters:
      type: object
      properties:
        entity_id:
          type: string
          description: "entity_id"
      required:
      - entity_id
    function:
      type: template
      value_template: "{{states[entity_id]}}"

  - name: get_tcl_maison_to_cisl
    description: "Utilise cette fonction pour trouver le prochain horaire de départ du tramway T4 vers le CISL ou la NRL depuis la maison."
    parameters:
      type: object
      properties:
        dummy:
          type: string
          description: "Nothing"
    function:
      type: template
      value_template: >
        {%- set ns = namespace(lignes=[]) -%}
        {%- for trip in state_attr('sensor.tram_villette_cisl', 'trips') -%}
          {%- set depart = as_local(as_datetime(trip.departure.time)) -%}
          {%- set arrive = as_local(as_datetime(trip.arrival.time)) -%}
          {%- if as_datetime(trip.departure.time) > now() -%}
            {%- set ns.lignes = ns.lignes + ["Départ " ~ depart.strftime('%H:%M') ~ " (" ~ trip.departure.status ~ "), arrivée " ~ arrive.strftime('%H:%M') ~ " (" ~ trip.arrival.status ~ ")"] -%}
          {%- endif -%}
        {%- endfor -%}
        {%- if ns.lignes | length == 0 -%}
          Aucun départ à venir trouvé.
        {%- else -%}
          {{ ns.lignes[:5] | join(" ; ") }}
        {%- endif -%}

  - name: get_tcl_cisl_to_maison
    description: "Utilise cette fonction pour trouver le prochain horaire de départ du tramway T4 vers la maison depuis le CISL ou la NRL."
    parameters:
      type: object
      properties:
        dummy:
          type: string
          description: "Nothing"
    function:
      type: template
      value_template: >
        {%- set ns = namespace(lignes=[]) -%}
        {%- for trip in state_attr('sensor.tram_cisl_villette', 'trips') -%}
          {%- set depart = as_local(as_datetime(trip.departure.time)) -%}
          {%- set arrive = as_local(as_datetime(trip.arrival.time)) -%}
          {%- if as_datetime(trip.departure.time) > now() -%}
            {%- set ns.lignes = ns.lignes + ["Départ " ~ depart.strftime('%H:%M') ~ " (" ~ trip.departure.status ~ "), arrivée " ~ arrive.strftime('%H:%M') ~ " (" ~ trip.arrival.status ~ ")"] -%}
          {%- endif -%}
        {%- endfor -%}
        {%- if ns.lignes | length == 0 -%}
          Aucun départ à venir trouvé.
        {%- else -%}
          {{ ns.lignes[:5] | join(" ; ") }}
        {%- endif -%}

  - name: get_events
    description: "Utilise cette fonction pour connaitre la liste des évènements ou rendez-vous ou rappels qui sont dans mon calendrier ou mon agenda. N'ajoute pas de symboles comme des étoiles ou des astérisques dans ta réponse. Si je te donne juste le mois, tu utilises les dates de début de mois et de fin de mois."
    parameters:
      type: object
      properties:
        start_date_time:
          type: string
          description: "The start date time in '%Y-%m-%dT%H:%M:%S%z' format"
        end_date_time:
          type: string
          description: "The end date time in '%Y-%m-%dT%H:%M:%S%z' format"
      required:
      - start_date_time
      - end_date_time
    function:
      type: composite
      sequence:
        - type: script
          sequence:
            - service: calendar.get_events
              data:
                start_date_time: "{{start_date_time}}"
                end_date_time: "{{end_date_time}}"
              target:
                entity_id:
                - calendar.xxx_yyy_gmail_com
              response_variable: _function_result
          response_variable: planning
        - type: template
          value_template: >-
            {% set ns = namespace(cal_events=[]) %}
            {%- for key, value in planning.items() %}
              {%- for event in value.events %}
                {%- set ns.cal_events = ns.cal_events + [event] | rejectattr('summary','search', 'GPS') | rejectattr('summary','search', 'débit CB') | list %}
              {%- endfor %}
            {%- endfor %}
            {{ ns.cal_events }}

  - name: search_brave
    description: "utilise cette fonction pour réaliser une recherche sur un sujet qui n'est pas lié à une demande sur le système domotique"
    parameters:
      type: object
      properties:
        query:
          type: string
          description: The search query.
      required:
      - query
    function:
      type: rest
      resource_template: "https://api.search.brave.com/res/v1/web/search?q={{ query }}&count=3"
      headers:
        Accept: "application/json"
        X-Subscription-Token: "REMPLACER_PAR_VOTRE_CLE"
      value_template: >-
        {% if value_json.web and value_json.web.results %}
        {% for item in value_json.web.results %}
        "{{ item.title | replace(',', ' ') }}","{{ item.url }}"
        {% endfor %}
        {% else %}
        No results found
        {% endif %}

  - name: allume_pour_canalplus
    description: "Utilise quand il y a une demande pour regarder canal plus"
    parameters:
    function:
      type: script
      sequence:
        - service: script.allumage_tout_pour_canalplus
          data: {}

  - name: allume_pour_netflix_amazon_streaming
    description: "utilise quand il y a une demande pour regarder netflix ou pour regarder amazon ou pour regarder du streaming"
    parameters:
    function:
      type: script
      sequence:
        - service: script.allumage_tout_pour_netflix_amazon
          data: {}

  - name: lancer_musique
    description: "utilise quand il y a une demande pour écouter de la musique"
    parameters:
    function:
      type: script
      sequence:
        - action: script.allumage_musique
          response_variable: _function_result

  - name: surveille_charge
    description: "TOUJOURS utiliser pour répondre à une demande de surveillance de mise en charge d'un téléphone mobile ou d'une tablette, même si le niveau de batterie est connu. Ne pas répondre directement, utiliser cette fonction"
    parameters:
    function:
      type: script
      sequence:
        - action: script.assist_surveille_charge
          response_variable: _function_result

  - name: alarme_sonore
    description: "mise en route de l'alarme en mode sonore"
    parameters:
    function:
      type: script
      sequence:
        - action: script.alarme_sonore
          response_variable: _function_result

  - name: alarme_silencieux
    description: "mise en route de l'alarme en mode silencieux"
    parameters:
    function:
      type: script
      sequence:
        - action: script.alarme_silencieux
          response_variable: _function_result

  - name: alarme_stop
    description: "arrêt de l'alarme"
    parameters:
    function:
      type: script
      sequence:
        - action: script.alarme_off
          response_variable: _function_result

  - name: trains_de_macon_a_lyon
    description: "donne la liste des trois prochains trains qui partent de Mâcon et arrivent à Lyon Part Dieu. Indique aussi le type de train dans ta réponse."
    parameters:
    function:
      type: template
      value_template: >-
        {% set sensor = 'sensor.macon_to_lyon' %}
        {% set ns = namespace(result=[]) %}
        {% if states(sensor) in ['unavailable', 'unknown', 'none'] %}
           {{ ns.result | join('Plus de trains ce jour\n') }}
        {% else %}
          {% set numeros = state_attr(sensor,'next_departures_headsign') | regex_findall('\((\d+)\)') %}
          {% set trips = state_attr(sensor,'next_departures_trips') %}
          {% set arrivals = state_attr(sensor,'next_departures_destination_arrival_times') %}
          {% for departure in state_attr(sensor,'next_departures')[:5] %}
            {% set depart = as_local(as_datetime(departure)) %}
            {% set arrivee = as_local(as_datetime(arrivals[loop.index0])) %}
            {% set duree = arrivee - depart %}
            {% set trip = trips[loop.index0] %}
            {% set type_train = trip.split('::')[0].split(':')[1] %}
            {% if depart > now() %}
              {% set ns.result = ns.result + [dict(
                  départ_hhmm=depart.strftime('%H:%M'),
                  arrivée_hhmm=arrivee.strftime('%H:%M'),
                  train=numeros[loop.index0],
                  durée_minutes=duree.total_minutes(),
                  type=('TER' if type_train == 'TER' else 'Intercités' if type_train == 'IC' else 'TGV')
                  )] %}
            {% endif %}
          {% endfor %}
        {% endif %}
        {{ ns.result | join('\n') }}

  - name: trains_de_lyon_a_macon
    description: "donne la liste des trois prochains trains qui partent de Lyon Part Dieu et arrivent à Mâcon. Donne aussi le type de train dans ta réponse."
    parameters:
    function:
      type: template
      value_template: >-
        {% set sensor = 'sensor.lyon_to_macon' %}
        {% set ns = namespace(result=[]) %}
        {% if states(sensor) in ['unavailable', 'unknown', 'none'] %}
           {{ ns.result | join('Plus de trains ce jour\n') }}
        {% else %}
          {% set numeros = state_attr(sensor,'next_departures_headsign') | regex_findall('\((\d+)\)') %}
          {% set trips = state_attr(sensor,'next_departures_trips') %}
          {% set arrivals = state_attr(sensor,'next_departures_destination_arrival_times') %}
          {% for departure in state_attr(sensor,'next_departures')[:5] %}
            {% set depart = as_local(as_datetime(departure)) %}
            {% set arrivee = as_local(as_datetime(arrivals[loop.index0])) %}
            {% set duree = arrivee - depart %}
            {% set trip = trips[loop.index0] %}
            {% set type_train = trip.split('::')[0].split(':')[1] %}
            {% if depart > now() %}
              {% set ns.result = ns.result + [dict(
                  départ_hhmm=depart.strftime('%H:%M'),
                  arrivée_hhmm=arrivee.strftime('%H:%M'),
                  train=numeros[loop.index0],
                  durée_minutes=duree.total_minutes(),
                  type=('TER' if type_train == 'TER' else 'Intercités' if type_train == 'IC' else 'TGV')
                  )] %}
            {% endif %}
          {% endfor %}
        {% endif %}
        {{ ns.result | join('\n') }}
